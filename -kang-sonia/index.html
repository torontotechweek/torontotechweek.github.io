<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>KANG, S. // 3195</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&family=Newsreader:ital,opsz,wght@0,6..72,600;0,6..72,700;1,6..72,500&display=swap" rel="stylesheet">
    <style>
        :root {
            /* Borderless Tonal Color-Blocking sampled from the gouache-vector art */
            --surface-backdrop: #E5E1D8;
            --plane-header: #EAE4D7;
            --plane-sandstone: #F4F1EA;
            --plane-slate: #DCE4EA;
            --plane-sage: #E6ECE4;
            --ink-river: #1E2D38;
            --ink-muted: #52636E;
            --canopy-pine: #2D5341;
            --accent-ochre: #C97A3D;

            --font-editorial: 'Newsreader', Georgia, serif;
            --font-sans: 'Inter', sans-serif;
            --font-mono: 'JetBrains Mono', monospace;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--surface-backdrop);
            color: var(--ink-river);
            font-family: var(--font-sans);
            min-height: 100vh;
            display: flex;
            align-items: flex-start;
            justify-content: center;
            padding: 1rem;
        }

        /* Single Card: Borderless Tonal Editorial Profile Card */
        .library-card {
            width: 100%;
            max-width: 400px;
            display: grid;
            grid-template-columns: 1fr 164px;
            background: var(--plane-sandstone);
            box-shadow:
                0 1px 2px rgba(30, 45, 56, 0.06),
                0 14px 32px -8px rgba(30, 45, 56, 0.14);
        }

        .cell {
            padding: 1rem 1.15rem;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-width: 0;
        }

        .card-header {
            grid-column: span 2;
            padding: 0.6rem 1.15rem;
            display: flex;
            flex-direction: row;
            justify-content: space-between;
            align-items: center;
            gap: 0.5rem;
            background: var(--plane-header);
            color: var(--ink-muted);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 500;
            letter-spacing: 0.09em;
            text-transform: uppercase;
            white-space: nowrap;
        }

        .header-institution {
            display: inline-flex;
            align-items: center;
            gap: 0.45rem;
            color: var(--ink-river);
            font-weight: 700;
        }

        .header-dot {
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--accent-ochre);
            display: inline-block;
        }

        .card-identity {
            grid-column: 1 / 2;
            padding: 0.85rem 1rem 1.15rem 1.15rem;
            background: var(--plane-sandstone);
            gap: 0.9rem;
        }

        .display-name {
            font-family: var(--font-editorial);
            font-size: 2.25rem;
            font-weight: 700;
            line-height: 0.95;
            letter-spacing: -0.025em;
            color: var(--ink-river);
            overflow-wrap: break-word;
            word-break: break-word;
        }

        .role-block {
            font-family: var(--font-sans);
            font-size: 0.74rem;
            line-height: 1.38;
        }

        .role-title {
            font-weight: 700;
            color: var(--ink-river);
            display: block;
        }

        .role-dept {
            font-weight: 400;
            color: var(--ink-muted);
            display: block;
            margin-top: 2px;
        }

        .card-portrait {
            grid-column: 2 / 3;
            padding: 0;
            background: var(--plane-slate);
            min-height: 192px;
            position: relative;
            overflow: hidden;
        }

        .card-portrait img {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            height: 100%;
            width: auto;
            display: block;
        }

        .card-portrait svg {
            width: 82%;
            height: 82%;
            margin: auto;
        }

        .card-subjects {
            grid-column: span 2;
            background: var(--plane-sage);
            padding: 1rem 1.15rem;
        }

        .concept-tags {
            display: flex;
            flex-direction: column;
            gap: 0.38rem;
        }

        .c-tag {
            display: grid;
            grid-template-columns: 2.2ch 1fr;
            column-gap: 0.7rem;
            align-items: baseline;
            font-size: 0.73rem;
            line-height: 1.35;
        }

        .tag-idx {
            font-family: var(--font-mono);
            font-size: 0.65rem;
            font-weight: 700;
            color: var(--accent-ochre);
        }

        .tag-text {
            font-family: var(--font-sans);
            font-weight: 500;
            color: var(--ink-river);
            min-width: 0;
        }

        .c-tag-more .tag-text {
            font-family: var(--font-sans);
            font-size: 0.7rem;
            font-weight: 600;
            color: var(--canopy-pine);
        }

        .cell-map {
            grid-column: span 2;
            background: var(--ink-river);
            color: var(--plane-sandstone);
            position: relative;
            overflow: hidden;
            padding: 0;
            min-height: 146px;
        }

        .cell-map .map-bg {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100%;
            height: auto;
            pointer-events: none;
            display: block;
        }

        .map-address-overlay {
            position: relative;
            margin-top: auto;
            width: 100%;
            padding: 1.35rem 1.15rem 0.65rem;
            background: linear-gradient(
                to top,
                rgba(30, 45, 56, 0.9) 0%,
                rgba(30, 45, 56, 0.55) 55%,
                rgba(30, 45, 56, 0) 100%
            );
            font-family: var(--font-sans);
            font-size: 0.72rem;
            font-weight: 500;
            line-height: 1.35;
            color: var(--plane-sandstone);
            z-index: 1;
        }

        .card-ledger {
            grid-column: span 2;
            padding: 0;
            display: grid;
            grid-template-columns: 1fr auto;
            background: var(--canopy-pine);
            color: var(--plane-sandstone);
            font-family: var(--font-mono);
            font-size: 0.65rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
        }

        .ledger-link,
        .card-action {
            padding: 0.7rem 1.15rem;
            color: var(--plane-sandstone);
            text-decoration: none;
            font-weight: 600;
            display: flex;
            align-items: center;
            transition: background 0.15s ease, color 0.15s ease;
        }

        .ledger-link {
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-action {
            background: rgba(30, 45, 56, 0.22);
        }

        .ledger-link:hover,
        .card-action:hover {
            background: var(--accent-ochre);
            color: var(--ink-river);
        }
    </style>
</head>
<body>

    <article class="library-card">

        <header class="cell card-header">
            <span class="header-institution"><span class="header-dot"></span>U of T</span>
            <span>3195</span>
        </header>

        <section class="cell card-identity">
            <h1 class="display-name">Sonia<br>Kang</h1>
            <div class="role-block">
                <span class="role-title">Professor</span>
                <span class="role-dept">University of Toronto Mississauga, Department of Management</span>
            </div>
        </section>

        <section class="cell card-portrait">
            <img src="-kang-sonia_1.png" alt="Sonia Kang">
        </section>

        <section class="cell card-subjects">
            <div class="concept-tags">
                <div class="c-tag"><span class="tag-idx">01</span><span class="tag-text">Aging process</span></div>
                <div class="c-tag"><span class="tag-idx">02</span><span class="tag-text">Business, commercial and corporate law</span></div>
                <div class="c-tag"><span class="tag-idx">03</span><span class="tag-text">Gender psychology</span></div>
                <div class="c-tag"><span class="tag-idx">04</span><span class="tag-text">Race and ethnic relations</span></div>
            </div>
        </section>

        <section class="cell cell-map">
            <img class="map-bg" src="3359_mississauga_road.jpeg" alt="3359 Mississauga Road, Toronto, Ontario">
            <div class="map-address-overlay">3359 Mississauga Road, Toronto, Ontario</div>
        </section>

        <footer class="cell card-ledger">
            <a href="https://discover.research.utoronto.ca/3195-kang-sonia" target="_blank" rel="noopener noreferrer" class="ledger-link" title="https://discover.research.utoronto.ca/3195-kang-sonia">DISCOVERY PROFILE ↗</a>
            <a href="mailto:sonia.kang@rotman.utoronto.ca" class="card-action" title="sonia.kang@rotman.utoronto.ca">CONTACT ↗</a>
        </footer>

    </article>

</body>
</html>
